name: health_management_app
description: HealthPal - Personal Health Management

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 國際化支援
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # 圖表
  fl_chart: ^0.66.0
  
  # 日期格式化
  intl: ^0.20.2
  
  # 外部連結
  url_launcher: ^6.2.3
  
  # Firebase 相關
  image_picker: ^1.0.4 
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.0.3

  # 本地通知
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # PDF 生成和列印功能
  printing: ^5.9.1
  pdf: ^3.10.1

  # 本地儲存
  shared_preferences: ^2.2.2

  # 安全儲存 (加密)
  flutter_secure_storage: ^9.2.4

  # 生物辨識認證 (Face ID / 指紋)
  local_auth: ^2.3.0

  # HealthKit / Google Fit 整合
  health: ^13.2.1
  permission_handler: ^11.3.1

  # OpenAI ChatGPT API
  dart_openai: ^5.1.0

  # 環境變數設定
  flutter_dotenv: ^5.1.0

  # HTTP 客戶端（用於 OpenAI API 呼叫）
  http: ^1.1.0

  # 主畫面小工具
  home_widget: ^0.7.0

  # QR Code 掃描（用於處方簽辨識）
  mobile_scanner: ^6.0.0

  # Base64 圖片編碼
  image: ^4.2.0

  # 社交登入 (Google / Apple)
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.6

  # QR Code 生成
  qr_flutter: ^4.1.0

  # 品牌 icon（Google logo 等）
  font_awesome_flutter: ^10.7.0

  # 分享功能
  share_plus: ^10.1.4

  # 字體
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/Google_icon.png
    - assets/icon.png